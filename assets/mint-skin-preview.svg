<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30e3ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f3f6f6" stop-opacity="1" />
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#11999e" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#f3f6f6" />
  <rect x="0" y="0" width="1440" height="96" fill="#ffffff" stroke="#bcd3d0" stroke-width="3" />
  <text x="48" y="58" fill="#40514e" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Minimal Mistakes · Mint Skin</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#40514e" text-anchor="end">
    <text x="1180" y="58">Archive</text>
    <text x="1270" y="58">Categories</text>
    <text x="1370" y="58">About</text>
  </g>
  <rect x="0" y="96" width="1440" height="230" fill="url(#heroGlow)" stroke="#bcd3d0" stroke-width="3" />
  <text x="48" y="158" fill="#40514e" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700">Crisp contrast, refreshing mint.</text>
  <text x="48" y="198" fill="#6b7b79" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400">This preview spotlights the Mint skin palette with cool teal accents on a light, airy canvas.</text>
  <text x="48" y="226" fill="#6b7b79" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Buttons and navigation share the same calming hue to mirror the skin's feel in the theme.</text>
  <rect x="48" y="246" width="148" height="46" rx="10" fill="#11999e" filter="url(#shadow)" />
  <text x="72" y="275" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Read more</text>
  <rect x="214" y="246" width="148" height="46" rx="10" fill="#11999e" filter="url(#shadow)" />
  <text x="240" y="275" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">See posts</text>
  <g transform="translate(0,346)" stroke="#bcd3d0" stroke-width="2">
    <rect x="48" y="0" width="404" height="240" rx="14" fill="#ffffff" filter="url(#shadow)" />
    <rect x="518" y="0" width="404" height="240" rx="14" fill="#ffffff" filter="url(#shadow)" />
    <rect x="988" y="0" width="404" height="240" rx="14" fill="#ffffff" filter="url(#shadow)" />
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#40514e" font-size="22" font-weight="700">
    <text x="72" y="384">Open and breathable</text>
    <text x="542" y="384">Confident accents</text>
    <text x="1012" y="384">Friendly footers</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#6b7b79" font-size="18" font-weight="400">
    <text x="72" y="418">Light surfaces and subtle borders keep long reads</text>
    <text x="72" y="444">comfortable for bright-mode browsing.</text>
    <text x="542" y="418">Links and buttons rely on the mint primary tone,</text>
    <text x="542" y="444">echoing the theme's navigation hover treatment.</text>
    <text x="1012" y="418">A saturated footer band grounds the layout and</text>
    <text x="1012" y="444">matches how the theme styles social sections.</text>
  </g>
  <rect x="0" y="712" width="1440" height="188" fill="#30e3ca" stroke="#bcd3d0" stroke-width="3" />
  <text x="720" y="790" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Mint skin preview · Minimal Mistakes Jekyll theme</text>
</svg>
