<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f1d9b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#521477" stop-opacity="1" />
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#521477" />
  <rect x="0" y="0" width="1440" height="96" fill="#270834" stroke="#6b228c" stroke-width="3" />
  <text x="48" y="58" fill="#fffd86" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Minimal Mistakes · Plum Skin</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fffd86" text-anchor="end">
    <text x="1180" y="58">Archive</text>
    <text x="1270" y="58">Categories</text>
    <text x="1370" y="58">About</text>
  </g>
  <rect x="0" y="96" width="1440" height="230" fill="url(#heroGlow)" stroke="#6b228c" stroke-width="3" />
  <text x="48" y="158" fill="#fffd86" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700">Bold contrast, playful purple.</text>
  <text x="48" y="198" fill="#fffec4" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400">This preview highlights the Plum skin palette with soft yellow text on a rich purple backdrop.</text>
  <text x="48" y="226" fill="#fffec4" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Buttons and navigation reuse the primary accent to match how the skin feels in the theme.</text>
  <rect x="48" y="246" width="148" height="46" rx="10" fill="#c327ab" filter="url(#shadow)" />
  <text x="72" y="275" fill="#fffd86" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Read more</text>
  <rect x="214" y="246" width="148" height="46" rx="10" fill="#c327ab" filter="url(#shadow)" />
  <text x="240" y="275" fill="#fffd86" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">See posts</text>
  <g transform="translate(0,346)" stroke="#6b228c" stroke-width="2">
    <rect x="48" y="0" width="404" height="240" rx="14" fill="#350c4d" filter="url(#shadow)" />
    <rect x="518" y="0" width="404" height="240" rx="14" fill="#350c4d" filter="url(#shadow)" />
    <rect x="988" y="0" width="404" height="240" rx="14" fill="#350c4d" filter="url(#shadow)" />
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#fffd86" font-size="22" font-weight="700">
    <text x="72" y="384">Readable on dark</text>
    <text x="542" y="384">Accent links</text>
    <text x="1012" y="384">Framed sections</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#f6f0a6" font-size="18" font-weight="400">
    <text x="72" y="418">High-contrast text keeps long reads comfortable</text>
    <text x="72" y="444">even on the deepest sections of the layout.</text>
    <text x="542" y="418">Links brighten toward magenta on hover to mirror</text>
    <text x="542" y="444">the theme's navigation hover treatment.</text>
    <text x="1012" y="418">Thin borders set cards and content blocks apart</text>
    <text x="1012" y="444">without losing the cohesive purple glow.</text>
  </g>
  <rect x="0" y="712" width="1440" height="188" fill="#270834" stroke="#6b228c" stroke-width="3" />
  <text x="720" y="790" fill="#f0e7a1" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Plum skin preview · Minimal Mistakes Jekyll theme</text>
</svg>
